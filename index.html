<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- El uso de rutas relativas es crucial para GitHub Pages -->
    <title>Curso 4° C - EPET 5 | Informática</title>
    
    <!-- Fuente Inter de Google Fonts para un aspecto limpio -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Carga de Tailwind CSS vía CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            blue: '#2563eb',
                            green: '#16a34a'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 sm:p-6 selection:bg-blue-200 selection:text-blue-900">

    <!-- Tarjeta central -->
    <main class="max-w-lg w-full bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden relative">
        
        <!-- Banda superior decorativa -->
        <div class="h-2 w-full bg-gradient-to-r from-blue-500 to-indigo-500"></div>

        <div class="p-8 sm:p-10">
            <!-- Encabezado -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 text-blue-600 mb-4 ring-8 ring-blue-50/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                </div>
                <h1 class="text-3xl font-extrabold text-gray-900 mb-2 tracking-tight">Curso 4° C</h1>
                <h2 class="text-lg font-semibold text-blue-600 mb-3 uppercase tracking-wider">EPET 5 - Informática</h2>
                <p class="text-gray-500 text-sm sm:text-base">
                    Bienvenido/a. Desde este portal puedes descargar el material de la asignatura o dirigirte a la web de referencia.
                </p>
            </div>

            <div class="space-y-4">
                
                <!-- Botón 1: Descarga de Excel (Color Verde) -->
                <!-- RUTAS RELATIVAS PARA GITHUB PAGES: './archivo_excel.xlsx' asegura que busque en la misma carpeta del repo -->
                <a href="./datos_termodinamica.xlsx" download="datos_termodinamica.xlsx" 
                   class="group flex items-center justify-center w-full px-6 py-4 bg-green-600 hover:bg-green-700 text-white text-base font-semibold rounded-xl transition-all duration-200 shadow-sm hover:shadow-md hover:shadow-green-600/20 active:scale-[0.98]">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mr-3 group-hover:-translate-y-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" />
                    </svg>
                    Descargar Archivo Excel
                </a>

                <!-- Botón 2: Redirección (Color Azul) -->
                <a href="https://drive.google.com/file/d/1UKKAj9UwdvB1gGc-xQaa5wryqaBlwFQ7/view?usp=drive_link" target="_blank" rel="noopener noreferrer" 
                   class="group flex items-center justify-center w-full px-6 py-4 bg-blue-600 hover:bg-blue-700 text-white text-base font-semibold rounded-xl transition-all duration-200 shadow-sm hover:shadow-md hover:shadow-blue-600/20 active:scale-[0.98]">
                    
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 mr-3 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    Ir a la Actividad
                </a>

            </div>
            
            <div class="mt-8 text-center">
                <span class="text-xs text-gray-400 font-medium">Ciclo Lectivo 2026</span>
            </div>
        </div>
    </main>

</body>
</html>
